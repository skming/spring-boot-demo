spring:
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  application:
    name: db-lab
  profiles:
    default: sqlite
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:local-dev-only-change-me-32chars-min}
    jwt-expiration-minutes: 720
  lab:
    max-rows: 200
    statement-timeout-ms: 5000
