spring:
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://localhost:3306/dblab?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${APP_DB_USERNAME:dblab}
    password: ${APP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    locations: classpath:db/migration

app:
  lab:
    datasource:
      url: ${APP_LAB_DB_URL:${spring.datasource.url}}
      username: ${APP_LAB_DB_USERNAME:${spring.datasource.username}}
      password: ${APP_LAB_DB_PASSWORD:${spring.datasource.password}}
